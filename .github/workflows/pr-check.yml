name: Pull Request Check 🧪

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:
    inputs:
      pr_number:
        description: 'PR number to manually test'
        required: false
        default: ''

concurrency:
  group: pr-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: read

jobs:
  test_and_build:
    name: Test & Build Gate 🛡️
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code 🛡️
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: ⚙️ Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: 📦 Install Dependencies
        run: npm ci

      - name: 🔍 Type Check & Lint
        run: npm run lint

      - name: 🧪 Run Automated Vitest Suites
        run: npm test

      - name: 🏗️ Compile Production Bundle
        run: npm run build

      - name: 📚 Build Documentation
        run: npm run docs:build

      - name: 📤 Upload Production Dist Artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: shellguard-pr-dist
          path: dist/
          retention-days: 7
