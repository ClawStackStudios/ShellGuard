name: Create GitHub Release 📦

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code 🛡️
        uses: actions/checkout@v4

      - name: Locate Release Notes 📝
        id: release_notes
        run: |
          TAG_NAME="${{ github.ref_name }}"
          RELEASE_FILE="RELEASE-${TAG_NAME}.md"
          if [ -f "$RELEASE_FILE" ]; then
            echo "Found $RELEASE_FILE"
            echo "path=$RELEASE_FILE" >> $GITHUB_OUTPUT
          else
            # Fallback to newest RELEASE-v*.md file if exact version not found
            LATEST_RELEASE=$(ls -1t RELEASE-v*.md 2>/dev/null | head -n 1)
            if [ -n "$LATEST_RELEASE" ]; then
              echo "Falling back to $LATEST_RELEASE"
              echo "path=$LATEST_RELEASE" >> $GITHUB_OUTPUT
            else
              echo "No RELEASE file found. Using tag annotation."
              echo "path=" >> $GITHUB_OUTPUT
            fi
          fi

      - name: Publish GitHub Release 🚀
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: ShellGuard ${{ github.ref_name }}
          body_path: ${{ steps.release_notes.outputs.path }}
          draft: false
          prerelease: false
          generate_release_notes: ${{ steps.release_notes.outputs.path == '' }}
