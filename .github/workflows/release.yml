name: Create GitHub Release 📦

on:
  push:
    branches:
      - main
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code 🛡️
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detect Release Trigger & Version 🔍
        id: detect
        run: |
          if [[ "${{ github.ref }}" == refs/tags/* ]]; then
            TAG="${{ github.ref_name }}"
            echo "Triggered by tag push: $TAG"
            echo "should_release=true" >> $GITHUB_OUTPUT
            echo "tag=$TAG" >> $GITHUB_OUTPUT
          else
            COMMIT_MSG=$(git log -1 --pretty=%B)
            # Match patterns like "--release v0.0.1.5", "--release 0.0.1.5", "[--release v0.0.1.5]"
            if echo "$COMMIT_MSG" | grep -iE -- '--release[ =]+v?[0-9]+\.[0-9]+\.[0-9]+(\.[0-9]+)?' > /dev/null; then
              EXTRACTED_TAG=$(echo "$COMMIT_MSG" | grep -ioE -- '--release[ =]+v?[0-9]+\.[0-9]+\.[0-9]+(\.[0-9]+)?' | sed -E 's/--release[ =]+//i')
              # Ensure leading 'v'
              if [[ ! "$EXTRACTED_TAG" =~ ^v ]]; then
                EXTRACTED_TAG="v$EXTRACTED_TAG"
              fi
              echo "Detected release flag in commit: $EXTRACTED_TAG"
              echo "should_release=true" >> $GITHUB_OUTPUT
              echo "tag=$EXTRACTED_TAG" >> $GITHUB_OUTPUT

              # Tag the commit on remote if tag does not exist
              if ! git rev-parse "$EXTRACTED_TAG" >/dev/null 2>&1; then
                echo "Creating and pushing tag $EXTRACTED_TAG"
                git config user.name "github-actions[bot]"
                git config user.email "github-actions[bot]@users.noreply.github.com"
                git tag -a "$EXTRACTED_TAG" -m "Release $EXTRACTED_TAG"
                git push origin "$EXTRACTED_TAG"
              fi
            else
              echo "No release trigger found in commit message. Skipping release creation."
              echo "should_release=false" >> $GITHUB_OUTPUT
            fi
          fi

      - name: Locate Release Notes 📝
        if: steps.detect.outputs.should_release == 'true'
        id: release_notes
        run: |
          TAG="${{ steps.detect.outputs.tag }}"
          RELEASE_FILE="RELEASE-${TAG}.md"
          if [ -f "$RELEASE_FILE" ]; then
            echo "Found $RELEASE_FILE"
            echo "path=$RELEASE_FILE" >> $GITHUB_OUTPUT
          else
            # Fallback to newest RELEASE-v*.md file if exact version not found
            LATEST_RELEASE=$(ls -1t RELEASE-v*.md 2>/dev/null | head -n 1)
            if [ -n "$LATEST_RELEASE" ]; then
              echo "Falling back to $LATEST_RELEASE"
              echo "path=$LATEST_RELEASE" >> $GITHUB_OUTPUT
            else
              echo "No RELEASE file found. Using tag annotation."
              echo "path=" >> $GITHUB_OUTPUT
            fi
          fi

      - name: Publish GitHub Release 🚀
        if: steps.detect.outputs.should_release == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.detect.outputs.tag }}
          name: ShellGuard ${{ steps.detect.outputs.tag }}
          body_path: ${{ steps.release_notes.outputs.path }}
          draft: false
          prerelease: false
          generate_release_notes: ${{ steps.release_notes.outputs.path == '' }}

