<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" fill="none">
  <defs>
    <linearGradient id="sg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e4048a" />
      <stop offset="50%" stop-color="#ec4899" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>
    <filter id="sg-glow" x="-25%" y="-25%" width="150%" height="150%">
      <feGaussianBlur stdDeviation="1.2" result="glow" />
      <feComposite in="SourceGraphic" in2="glow" operator="over" />
    </filter>
  </defs>
  <rect width="32" height="32" rx="8" fill="#080c14" stroke="#e4048a" stroke-width="1.5" stroke-opacity="0.4"/>
  <!-- Notched Carapace Shield Outline -->
  <path d="M16 4.5L19.5 6.5L24.5 5.5V14.5C24.5 20.8 19.5 26 16 27.5C12.5 26 7.5 20.8 7.5 14.5V5.5L12.5 6.5L16 4.5Z" 
        stroke="url(#sg-grad)" stroke-width="2" stroke-linejoin="round" filter="url(#sg-glow)"/>
  
  <!-- Central Full Web Globe (Multi-Grid WWW Icon in ShellGuard Purple/Pink) -->
  <!-- Outer Globe Circle -->
  <circle cx="16" cy="16" r="5.2" stroke="#e4048a" stroke-width="1.15" filter="url(#sg-glow)"/>
  
  <!-- Equator (Horizontal Center) -->
  <line x1="10.8" y1="16" x2="21.2" y2="16" stroke="#ec4899" stroke-width="0.9" stroke-linecap="round"/>
  
  <!-- Prime Meridian (Vertical Center) -->
  <line x1="16" y1="10.8" x2="16" y2="21.2" stroke="#ffffff" stroke-width="0.9" stroke-linecap="round" stroke-opacity="0.95"/>
  
  <!-- Vertical Meridians (Left & Right) -->
  <ellipse cx="16" cy="16" rx="2.7" ry="5.2" stroke="#c026d3" stroke-width="0.85" fill="none"/>
  
  <!-- Horizontal Latitudes (North & South) -->
  <path d="M 12.0 13.0 Q 16 14.3 20.0 13.0" stroke="#f472b6" stroke-width="0.8" stroke-linecap="round" fill="none"/>
  <path d="M 12.0 19.0 Q 16 17.7 20.0 19.0" stroke="#f472b6" stroke-width="0.8" stroke-linecap="round" fill="none"/>
</svg>
