name: Continuous Integration & Verification 🧪

on:
  push:
    branches:
      - main
      - 'feat/**'
      - 'fix/**'
      - 'docs/**'
      - 'chore/**'
      - 'stage/**'
      - 'stage-*'
      - 'feature/**'
    tags-ignore:
      - 'v*'
  pull_request:
    branches:
      - main
      - 'stage/**'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test_and_build:
    name: Test & Production Build (Cloud Runner) 🚀
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code 🛡️
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: ⚙️ Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: 📦 Install Dependencies
        run: npm ci

      - name: 🔍 Type Check & Lint
        run: npm run lint

      - name: 🧪 Run Automated Vitest Suites
        run: npm test

      - name: 🏗️ Compile Production Bundle
        run: npm run build

      - name: 📚 Build Documentation
        run: npm run docs:build

      - name: 📤 Upload Production Dist Artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: shellguard-dist
          path: dist/
          retention-days: 7
